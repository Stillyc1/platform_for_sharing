<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Главная страница{% endblock %}</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5; /* Замените этот код на ваш желаемый цвет f5f5f5*/
        }
        .btn-hand {
            background-color: transparent; /* Прозрачный фон */
            color: #666; /* Серый цвет текста */
            text-decoration: none; /* Убираем подчеркивание */
            padding: 10px; /* Отступы */
            border: none; /* Без границы */
            transition: color 0.3s; /* Плавный переход для цвета текста */
        }

        .btn-hand:hover {
            color: #77dd77; /* Здесь укажите нужный цвет текста при наведении */
        }
    </style>
</head>
    <body>
        {% block header %}
        {% endblock %}
        <div class="container">
            {% block content %}
            {% endblock %}

            <footer class="pt-4 my-md-5 pt-md-5 border-top text-center">
                <a href="#top" id="back-to-top" class="btn btn-outline-dark" title="Back to top">наверх</a>
            </footer>
        </div>

        <script src="/static/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
